name: Render UI

# 手动触发：把各界面渲染成 PNG（中英各一套），传成 artifact 下载看。
# 用 App 自带的 --render-* 模式（样例状态，不碰真实数据），语言靠 SNUG_RENDER_LANG 选
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: 渲染界面截图
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Snug
        run: swift build --product Snug
      - name: 渲染（中文 + English）
        run: |
          BIN="$(swift build --product Snug --show-bin-path)/Snug"
          for lang in zh en; do
            for target in settings welcome about legacy update phone; do
              SNUG_RENDER_LANG=$lang "$BIN" --render-$target "renders/$lang/$target"
            done
          done
      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: renders/
          if-no-files-found: error
