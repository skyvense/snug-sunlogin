name: CI

# 门禁：PR 和默认分支的推送自动跑构建 + 全部测试。不签名、不碰任何 secrets，
# fork 来的 PR 也能跑（GitHub 本来就不给 fork 的 PR 发 secrets，这里也用不上）。
on:
  pull_request:
  push:
    branches: [main, feat/sunlogin-port]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 构建与测试
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: scripts/snug check（swift build + swift test）
        run: ./scripts/snug check

  render:
    name: 渲染界面截图（中英）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 构建 Snug
        run: swift build --product Snug
      - name: 渲染（中文 + English）
        run: |
          BIN="$(swift build --product Snug --show-bin-path)/Snug"
          for lang in zh en; do
            for target in settings welcome about legacy update phone; do
              SNUG_RENDER_LANG=$lang "$BIN" --render-$target "renders/$lang/$target"
            done
          done
      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: renders/
          if-no-files-found: error

  diag-app:
    name: 诊断包（Snug.app）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 打 App（编译机上没有开发者证书，ad-hoc 签名）
        run: ./scripts/snug app
      - name: 压缩（ditto 保住 App 包结构与签名）
        run: ditto -c -k --keepParent build/Snug.app Snug-diag.zip
      - name: 上传诊断包
        uses: actions/upload-artifact@v4
        with:
          name: snug-diag-app
          path: Snug-diag.zip
          if-no-files-found: error
