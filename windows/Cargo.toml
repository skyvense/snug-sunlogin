[package]
name = "snug-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "SnugWindows"
path = "src/main.rs"

[dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
] }

[profile.release]
opt-level = 2
