[package]
name = "snug-windows"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "SnugWindows"
path = "src/main.rs"

[dependencies]
# 解析与 Mac 版共用的机型库 JSON（Assets/phone-models.json）
serde_json = "1"
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
] }

[build-dependencies]
# 嵌图标与清单资源：成熟做法，避免自己在 build.rs 里找 rc.exe
winresource = "0.1"

[profile.release]
opt-level = 2
