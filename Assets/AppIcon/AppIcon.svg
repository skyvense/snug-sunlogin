<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 向日葵版图标：与原版 Snug 相同的「双屏叠片」构图，配色换成向日葵的金橙。
       几何与原版 AppIcon.svg 一致（见 Assets/AppIcon/README.md 的设计说明）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAF1E6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#FFC21A"/>
      <stop offset="1" stop-color="#FF9E00"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#F25C05"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="196" y="253" width="500" height="330" rx="52"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#552A0B" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- macOS 圆角底板 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- 电脑：支架 -->
  <rect x="426" y="575" width="40" height="60" fill="#FFAB00"/>
  <rect x="366" y="622" width="160" height="30" rx="15" fill="#FFAB00"/>

  <!-- 电脑：屏幕 -->
  <rect x="196" y="253" width="500" height="330" rx="52" fill="url(#screen)"/>

  <!-- 平板 -->
  <rect x="572" y="421" width="256" height="350" rx="44" fill="url(#tablet)"/>

  <!-- 交叠区：两块屏幕对齐的地方 -->
  <rect x="572" y="421" width="256" height="350" rx="44" fill="#D94800" clip-path="url(#screenClip)"/>
</svg>
